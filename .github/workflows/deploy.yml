# Deploy the damakese-site repository.
# Secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_PATH=/opt/damakese-site

name: Deploy Site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy site to VPS
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            bash scripts/deploy/deploy.sh
